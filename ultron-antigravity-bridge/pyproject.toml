[project]
name = "ultron-antigravity-bridge"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "google-antigravity",
    "sse-starlette",
    "pytest",
    "httpx",
    "python-dotenv"
]

[tool.pyright]
extraPaths = ["src", "."]

[tool.pyrefly]
search-paths = ["src", "."]
